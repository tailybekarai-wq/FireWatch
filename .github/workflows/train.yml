name: Train model

# Manual and reproducible: archive -> labels -> features -> training -> report.
# The result (ml/models/<version>/ and the dataset summary) is uploaded as an artifact
# for review; registering a version in the database stays a separate, deliberate step
# (python -m firewatch_ml.register).
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day of training objects (YYYY-MM-DD)"
        default: "2019-01-01"
      end:
        description: "Last day of training objects (YYYY-MM-DD)"
        default: "2025-12-31"

permissions:
  contents: read

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            shared/pyproject.toml
            pipeline/pyproject.toml
            ml/pyproject.toml
      - run: pip install -e ./shared -e "./ml[train]" -e ./pipeline
      - name: Download the VIIRS NOAA-20 SP archive
        run: python -m firewatch_ml.data --start 2018-04-01 --end "$END"
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          END: ${{ inputs.end }}
      - name: Build the dataset (labels from MCD64A1)
        run: python -m firewatch_ml.build_dataset --start "$START" --end "$END"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
      - name: Train and evaluate
        run: python -m firewatch_ml.train
      - uses: actions/upload-artifact@v7
        with:
          name: model-${{ github.run_id }}
          path: |
            ml/models/
            data/ml/dataset.json
          retention-days: 30
