[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "firewatch-ml"
version = "0.1.0"
description = "FireWatch model training, evaluation and registration (offline)."
requires-python = ">=3.12"
# Core: what scheduled scoring needs (shared features + LightGBM inference).
dependencies = [
    "firewatch-shared",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "lightgbm>=4.5",
]

[project.optional-dependencies]
# Offline dataset building, training and evaluation.
train = [
    "firewatch-pipeline",
    "httpx>=0.28",
    "pyarrow>=18",
    "rasterio>=1.4",
    "scikit-learn>=1.6",
    "shapely>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/firewatch_ml"]
