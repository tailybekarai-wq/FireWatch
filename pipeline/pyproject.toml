[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "firewatch-pipeline"
version = "0.1.0"
description = "FireWatch ingestion pipeline: fetch, validate, store and score satellite detections."
requires-python = ">=3.12"
# firewatch-ml (core) provides the shared features and LightGBM for scheduled scoring.
dependencies = [
    "firewatch-shared",
    "firewatch-ml",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "shapely>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/firewatch_pipeline"]
